name: .NET Desktop Build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        runtime: [win-x64, win-x86]

    runs-on: windows-latest

    env:
      Solution_Name: Adoracion.sln
      Project_Path: Adoracion.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Publish
      run: |
        $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { "0.9.0.${{ github.run_number }}" }
        dotnet publish $env:Project_Path `
          -c ${{ matrix.configuration }} `
          -r ${{ matrix.runtime }} `
          --self-contained false `
          -o ./publish/${{ matrix.runtime }} `
          -p:PublishReadyToRun=true `
          -p:Version=$ver
        Compress-Archive -Path ./publish/${{ matrix.runtime }}/* -DestinationPath ./publish/Adoracion-${{ matrix.runtime }}.zip

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Adoracion-${{ matrix.runtime }}
        path: ./publish/Adoracion-${{ matrix.runtime }}.zip

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./release-assets
        pattern: Adoracion-*
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || format('Nightly Build {0}', github.run_number) }}
        files: |
          ./release-assets/*.zip
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
